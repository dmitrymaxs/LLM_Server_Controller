name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build application
        run: pyinstaller LLMServerController-linux.spec

      - name: Create Linux archive
        run: |
          mkdir -p package
          cp dist/LLMServerController package/
          chmod +x package/LLMServerController
          tar -czf LLMServerController-Linux-${{ github.ref_name }}.tar.gz -C package LLMServerController

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: LLMServerController-Linux-${{ github.ref_name }}
          path: LLMServerController-Linux-${{ github.ref_name }}.tar.gz