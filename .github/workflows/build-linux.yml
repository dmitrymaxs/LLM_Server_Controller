name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build application
        run: pyinstaller LLMServerController-linux.spec

      - name: Make executable
        run: chmod +x dist/LLMServerController

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: LLMServerController-Linux
          path: dist/LLMServerController