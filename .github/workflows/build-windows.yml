name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Inject version into Windows spec
        shell: bash
        run: |
          sed -i "s/APP_VERSION = '.*'/APP_VERSION = '${{ steps.version.outputs.VERSION }}'/" LLMServerController.spec

      - name: Build application
        run: pyinstaller LLMServerController.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LLMServerController-Windows
          path: dist/LLMServerController.exe