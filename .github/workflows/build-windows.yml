name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build application
        run: pyinstaller LLMServerController.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LLMServerController-Windows
          path: dist/LLMServerController.exe