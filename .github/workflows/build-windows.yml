name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Determine version
        id: version
        shell: powershell
        run: |
          $VERSION = "0.0.0"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          }

          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "VERSION=$VERSION`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Inject version into Windows spec
        shell: powershell
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $content = [System.IO.File]::ReadAllText("LLMServerController.spec")
          $content = $content -replace "APP_VERSION = '.*'", "APP_VERSION = '$env:APP_VERSION'"

          [System.IO.File]::WriteAllText(
            "LLMServerController.spec",
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build application
        run: pyinstaller LLMServerController.spec

      - name: Upload Windows build (Gitea)
        if: ${{ contains(github.server_url, '192.168.0.180:3000') }}
        uses: christopherHX/gitea-upload-artifact@v4
        with:
          name: LLMServerController-Windows
          path: dist/LLMServerController.exe

      - name: Upload Windows build (GitHub)
        if: ${{ !contains(github.server_url, '192.168.0.180:3000') }}
        uses: actions/upload-artifact@v4
        with:
          name: LLMServerController-Windows
          path: dist/LLMServerController.exe