name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.2.0 or v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Normalize tag
        id: tag_info
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag }}"
          CLEAN_TAG="${RAW_TAG#v}"
          
          echo "TAG_WITH_V=v${CLEAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "TAG_CLEAN=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Find Windows and Linux workflow runs
        id: runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_WITH_V: ${{ steps.tag_info.outputs.TAG_WITH_V }}
          REPO: ${{ github.repository }}
        run: |
          echo "Looking for successful builds for tag: $TAG_WITH_V"

          SHA=$(gh api \
            "repos/$REPO/git/ref/tags/$TAG_WITH_V" \
            --jq '.object.sha')

          echo "Tag commit: $SHA"

          WINDOWS_RUN=$(gh run list \
            --repo "$REPO" \
            --workflow build-windows.yml \
            --event push \
            --status success \
            --limit 20 \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" \
            | head -n 1)

          LINUX_RUN=$(gh run list \
            --repo "$REPO" \
            --workflow build-linux.yml \
            --event push \
            --status success \
            --limit 20 \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" \
            | head -n 1)

          if [ -z "$WINDOWS_RUN" ]; then
            echo "ERROR: Windows build not found for $TAG_WITH_V"
            exit 1
          fi

          if [ -z "$LINUX_RUN" ]; then
            echo "ERROR: Linux build not found for $TAG_WITH_V"
            exit 1
          fi

          echo "Windows run: $WINDOWS_RUN"
          echo "Linux run:   $LINUX_RUN"

          echo "WINDOWS_RUN=$WINDOWS_RUN" >> "$GITHUB_OUTPUT"
          echo "LINUX_RUN=$LINUX_RUN" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: LLMServerController-Windows
          path: release/windows
          run-id: ${{ steps.runs.outputs.WINDOWS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: LLMServerController-Linux-v${{ steps.tag_info.outputs.TAG_CLEAN }}
          path: release/linux
          run-id: ${{ steps.runs.outputs.LINUX_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List release files
        run: |
          echo "Windows files:"
          find release/windows -type f -ls

          echo "Linux files:"
          find release/linux -type f -ls

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_WITH_V: ${{ steps.tag_info.outputs.TAG_WITH_V }}
        run: |
          gh release create "$TAG_WITH_V" \
            --repo "${{ github.repository }}" \
            --title "LLM Server Controller $TAG_WITH_V" \
            --generate-notes \
            release/windows/* \
            release/linux/*